# Check the complete locked graph, not only the current runner's target.
[advisories]
# Narrow, expiring maintenance exceptions; checked by scripts/check_advisories.py.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "syntect 5.3.0 uses bincode 1.3.3; tracked in advisory-exceptions.json" },
    { id = "RUSTSEC-2024-0436", reason = "ratatui 0.29.0 uses paste 1.0.15; tracked in advisory-exceptions.json" },
    { id = "RUSTSEC-2024-0320", reason = "syntect 5.3.0 uses yaml-rust 0.4.5; tracked in advisory-exceptions.json" },
]

[licenses]
allow = [
    "Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0",
    "CC0-1.0", "Zlib", "MIT-0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
