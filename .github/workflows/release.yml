name: Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact candidate SHA; dispatch on the corresponding candidate branch
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('release-preview-{0}', github.ref) || 'release-publication' }}
  cancel-in-progress: false

jobs:
  identity:
    if: >-
      github.repository == 'IamK77/Lattice' &&
      (github.event_name == 'workflow_dispatch' ||
       (vars.RELEASE_AUTOMATION_ENABLED == 'true' && github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (github.event.pull_request.head.ref == 'release/next' || github.event.pull_request.head.ref == 'release/hotfix-next')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
      preview: ${{ steps.validate.outputs.preview }}
      published: ${{ steps.validate.outputs.published }}
      retained_id: ${{ steps.validate.outputs.retained_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify canonical candidate, merge approval, tag history, and signing identity
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_release.py

  build:
    needs: identity
    if: needs.identity.outputs.preview == 'true' || (needs.identity.outputs.published != 'true' && needs.identity.outputs.retained_id == '')
    permissions:
      contents: read
    uses: ./.github/workflows/artifacts.yml
    with:
      commit: ${{ needs.identity.outputs.commit }}
      preview: ${{ needs.identity.outputs.preview == 'true' }}

  preview:
    needs: [identity, build]
    if: needs.identity.outputs.preview == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write
      attestations: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DISTRIBUTION: ${{ github.workspace }}/target/release-assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ env.DISTRIBUTION }}
      - name: Inspect data and prepare exact checksums without executing artifacts
        run: python3 scripts/publish_release.py stage --directory "$DISTRIBUTION"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: |
            ${{ env.DISTRIBUTION }}/*.tar.gz
            ${{ env.DISTRIBUTION }}/SHA256SUMS
            ${{ env.DISTRIBUTION }}/release-manifest.json
          create-storage-record: false
      - name: Keep the portable verification bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$DISTRIBUTION/provenance.json"
      - name: Verify all four signed subjects; dispatch never publishes
        run: python3 scripts/publish_release.py finalize --directory "$DISTRIBUTION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preview
          path: ${{ env.DISTRIBUTION }}/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  publish:
    needs: [identity, build]
    if: >-
      !cancelled() && needs.identity.result == 'success' && needs.identity.outputs.preview == 'false' &&
      (needs.build.result == 'success' || needs.identity.outputs.published == 'true' || needs.identity.outputs.retained_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      actions: read
      id-token: write
      attestations: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DISTRIBUTION: ${{ github.workspace }}/target/release-assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Locate the original signed distribution again on job-only retries
        id: retained
        run: python3 scripts/publish_release.py retained
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.retained.outputs.published != 'true' && steps.retained.outputs.retained_id != ''
        with:
          artifact-ids: ${{ steps.retained.outputs.retained_id }}
          merge-multiple: true
          path: ${{ env.DISTRIBUTION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.retained.outputs.published != 'true' && steps.retained.outputs.retained_id == ''
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ env.DISTRIBUTION }}
      - name: Recheck approval and inspect data, or recover immutable published assets
        id: stage
        run: python3 scripts/publish_release.py stage --directory "$DISTRIBUTION"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.stage.outputs.bundle_reused != 'true'
        id: attest
        with:
          subject-path: |
            ${{ env.DISTRIBUTION }}/*.tar.gz
            ${{ env.DISTRIBUTION }}/SHA256SUMS
            ${{ env.DISTRIBUTION }}/release-manifest.json
          create-storage-record: false
      - name: Keep the portable verification bundle
        if: steps.stage.outputs.bundle_reused != 'true'
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "$DISTRIBUTION/provenance.json"
      - name: Verify before retaining an immutable distribution
        run: python3 scripts/publish_release.py verify --directory "$DISTRIBUTION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.retained.outputs.published != 'true' && steps.retained.outputs.retained_id == ''
        with:
          name: sealed-release-${{ needs.identity.outputs.commit }}
          path: ${{ env.DISTRIBUTION }}/*
          if-no-files-found: error
          retention-days: 14
          overwrite: false
      - name: Verify proof, reserve the tag, fill the draft, and publish last
        run: python3 scripts/publish_release.py finalize --directory "$DISTRIBUTION"

  sync:
    needs: [identity, publish]
    if: needs.identity.outputs.preview == 'false' && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: stable-history-sync
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Return stable history through protected native PR checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_develop.py
