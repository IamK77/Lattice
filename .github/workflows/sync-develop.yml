name: Synchronize development

on:
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    if: github.repository == 'IamK77/Lattice' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: stable-history-sync
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Create or reuse the protected main-to-develop PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_develop.py
